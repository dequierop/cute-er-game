<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เวรฉุกเฉิน ระบบหมุนเวียนเลือด by KRUPOY</title>
<!-- เปลี่ยนฟอนต์เป็น Mali เพื่อความน่ารักและอ่านง่ายแบบลายมือ -->
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ธีมสีพาสเทลน่ารัก */
:root {
  --bg: #fff0f5; /* สีพื้นหลังชมพูอ่อน (Lavender Blush) */
  --card: #ffffff; /* สีพื้นหลังการ์ด */
  --ink: #5d4037; /* ตัวหนังสือสีน้ำตาลเข้มแทนสีดำเพื่อความละมุน */
  --mut: #8d6e63; /* ตัวหนังสือสีรอง */
  --gold: #ffda79; /* สีเหลืองทองน่ารัก */
  --green: #81c784; /* สีเขียวมิ้นต์ */
  --red: #ff8a80; /* สีแดงอมชมพู */
  --line: #d4a5a5; /* สีเส้นขอบชมพูตุ่น */
  --accent: #f48fb1; /* สีชมพูเน้นข้อความ/ปุ่ม */
  --ok: #e8f5e9;
  --bad: #ffebee;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #3e2723;
    --card: #4e342e;
    --ink: #fff8e1;
    --mut: #bcaaa4;
    --line: #5d4037;
    --ok: #33691e;
    --bad: #b71c1c;
    --gold: #ffb300;
    --accent: #f06292;
  }
}
* { box-sizing: border-box; }
body { 
  margin: 0; 
  background: var(--bg); 
  color: var(--ink); 
  font-family: "Mali", cursive, sans-serif; 
  line-height: 1.6; 
}
main { max-width: 560px; margin: 0 auto; padding: 16px; }

/* หัวเรื่องและการจัดข้อความแบบน่ารัก */
h1, .px { font-family: "Mali", cursive; font-weight: 700; }
h1 { 
  font-size: 22px; 
  line-height: 1.5; 
  margin: 12px 0; 
  text-align: center; 
  color: var(--accent);
}
/* กล่องข้อความสไตล์สติ๊กเกอร์ */
.box { 
  background: var(--card); 
  border: 3px solid var(--accent); 
  border-radius: 20px; 
  box-shadow: 4px 4px 0 var(--accent); 
  padding: 16px; 
  margin: 16px 0; 
}
/* ปุ่มสไตล์บับเบิ้ล */
button { 
  font: inherit; 
  font-weight: 700;
  color: var(--ink); 
  background: var(--gold); 
  border: 3px solid var(--accent); 
  border-radius: 16px; 
  box-shadow: 3px 3px 0 var(--accent); 
  padding: 12px 16px; 
  cursor: pointer; 
  width: 100%; 
  margin: 8px 0; 
  font-size: 16px; 
  transition: transform 0.1s, box-shadow 0.1s;
}
button:active { 
  transform: translate(3px, 3px); 
  box-shadow: 0px 0px 0 var(--accent); 
}
button:focus-visible, select:focus-visible, input:focus-visible { 
  outline: 4px solid var(--accent); 
  outline-offset: 2px; 
}
button.alt { 
  background: var(--card); 
  color: var(--ink); 
}
button:disabled { 
  opacity: 0.6; 
  cursor: default; 
  transform: none; 
  box-shadow: 3px 3px 0 var(--accent); 
}
.opt { background: var(--card); color: var(--ink); text-align: left; }
.opt.ok { background: var(--ok); border-color: var(--green); box-shadow: 3px 3px 0 var(--green); }
.opt.bad { background: var(--bad); border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
.bar { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; flex-wrap: wrap; font-weight: 600;}
.tag { 
  display: inline-block; 
  background: var(--accent); 
  color: #fff; 
  border-radius: 12px; 
  padding: 2px 10px; 
  font-size: 13px; 
  font-weight: 600;
}
.mut { color: var(--mut); font-size: 14px; }
/* กล่องเคสคนไข้น่ารักๆ */
.case { 
  background: #fff9c4; 
  color: var(--ink); 
  border: 3px dashed #ffb74d; 
  border-radius: 16px; 
  padding: 12px; 
  margin: 12px 0; 
  font-weight: 600;
}
/* ข้อมูล Data สีหวานๆ */
.data { 
  font-family: "Mali", cursive; 
  font-weight: 700;
  font-size: 13px; 
  color: #1565c0; 
  background: #e3f2fd; 
  border-radius: 12px; 
  padding: 10px; 
  margin: 8px 0; 
  border: 2px solid #90caf9;
}
.ex { 
  border-left: 6px solid var(--accent); 
  padding: 8px 12px; 
  margin: 12px 0; 
  background: var(--card); 
  border-radius: 0 12px 12px 0;
}
label { display: block; margin: 8px 0 2px; font-weight: 600; color: var(--accent);}
select, input { 
  font: inherit; 
  width: 100%; 
  padding: 10px; 
  border: 3px solid var(--line); 
  border-radius: 12px; 
  background: var(--card); 
  color: var(--ink); 
}
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.teams { display: flex; gap: 8px; flex-wrap: wrap; }
.tm { 
  flex: 1; 
  min-width: 90px; 
  border: 3px solid var(--line); 
  border-radius: 12px; 
  padding: 6px 10px; 
  font-size: 13px; 
  background: var(--card); 
  text-align: center;
}
.tm.on { 
  background: var(--gold); 
  color: var(--ink); 
  border-color: var(--accent);
  box-shadow: 2px 2px 0 var(--accent);
}
.meter { 
  height: 12px; 
  background: var(--card); 
  border: 2px solid var(--accent); 
  border-radius: 8px; 
  overflow: hidden; 
}
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.3s ease; }
.hidden { display: none; }
/* อวาตาร์แบบกลมๆ น่ารักๆ */
.avatar-wrap {
  background: var(--bg);
  border: 2px solid var(--accent);
  border-radius: 50%;
  padding: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Pixel-art visual update: title hero + reusable hospital gameplay backdrop */
#menu { position: relative; }
.title-hero { display:block; width:100%; height:auto; max-height:390px; object-fit:cover; object-position:center; border:4px solid #f3a5c7; border-radius:22px; box-shadow:0 5px 0 #d982ad; margin:4px auto 18px; image-rendering:pixelated; }
#menu h1 { display:none; }
#menu > p.mut { background:rgba(255,255,255,.88); border:2px solid #f3b5d0; border-radius:16px; padding:9px 12px; }
#game { position:relative; isolation:isolate; min-height:72vh; padding:12px; border-radius:24px; overflow:hidden; }
#game::before { content:""; position:absolute; inset:0; z-index:-2; background-image:url('assets/gameplay-bg.png'); background-size:cover; background-position:center; opacity:.92; }
#game::after { content:""; position:absolute; inset:0; z-index:-1; background:rgba(255,245,251,.38); pointer-events:none; }
#game .box { background:rgba(255,255,255,.93); backdrop-filter:blur(2px); }
#game .case, #game .data, #game .ex { background-color:rgba(255,255,255,.94); }
.site-credit { text-align:center; color:#98617f; font-size:12px; font-weight:700; padding:12px 8px 18px; margin:12px auto 0; }
.site-credit span { display:inline-block; background:rgba(255,255,255,.82); border:2px solid #f3bfd5; border-radius:999px; padding:5px 14px; }
@media(max-width:420px){ .title-hero{max-height:300px;border-width:3px} #game{padding:7px} }


/* === KRUPOY fullscreen pixel-game layout === */
html,body{min-height:100%;}
body{background:#fce8f2;overflow-x:hidden}
main{width:100%;max-width:none;margin:0;padding:0}
#menu,#setup,#result{min-height:100svh;padding:clamp(14px,2.4vw,30px);}
#menu{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(8px,1.4vh,16px);overflow:hidden;background:linear-gradient(180deg,#bde9ff 0%,#fce2f1 62%,#ffd5e5 100%);}
#menu:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 18%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 90% 24%,#fff9 0 3px,transparent 4px),linear-gradient(135deg,#dff5ff55,#ffecf655);background-size:46px 46px,67px 67px,auto;pointer-events:none}
#menu>*{position:relative;z-index:1}
.title-hero{width:min(92vw,980px);height:auto;max-height:47svh;object-fit:contain;border:0;border-radius:24px;box-shadow:0 8px 0 #d88cb2,0 14px 30px #a86d9630;margin:0 auto 4px;image-rendering:pixelated}
#menu h1{display:none}
.menu-intro{margin:0 auto;text-align:center;font-size:clamp(12px,1.4vw,17px);font-weight:700;color:#80516f;background:#ffffffd9;border:2px solid #f3b5d0;border-radius:999px;padding:5px 18px;box-shadow:0 3px 0 #e7a4c3}
.menu-actions{width:min(92vw,760px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.3vw,14px)}

.menu-actions button:first-child{grid-column:1/-1;background:linear-gradient(#ffe994,#ffc94d);border-color:#e6a62e;box-shadow:0 6px 0 #c58b2a;font-size:clamp(18px,2.2vw,26px);min-height:clamp(54px,8vh,76px)}
.menu-actions #bTeam{background:#dff3ff;border-color:#68bce8;box-shadow:0 5px 0 #579fc9}
.menu-actions #bShop{background:#ffe3f0;border-color:#e88ab5;box-shadow:0 5px 0 #c9789f}
.menu-actions #bRep{background:#eee5ff;border-color:#b39ae7;box-shadow:0 5px 0 #9179c4}
.menu-actions #bSettings{background:#d9fff3;border-color:#72cbb5;box-shadow:0 5px 0 #4ba38d}
.site-credit{margin:0 auto;padding:0 8px 3px;text-align:center;font-size:clamp(11px,1.3vw,15px);color:#81506f;font-weight:700}
.site-credit span{background:#fff9;border:2px solid #efb5d0;border-radius:999px;padding:5px 16px;display:inline-block}
#setup{max-width:760px;margin:0 auto;padding-top:22px}
#game{position:relative;isolation:isolate;min-height:100svh;width:100%;padding:clamp(12px,2vw,26px);border-radius:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;background:#f9dce9}
#game:before{content:"";position:absolute;inset:0;z-index:-2;background-image:url('assets/gameplay-bg.png');background-size:cover;background-position:center;opacity:.95}

#game>*{position:relative}
#game .game-hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(100%,1120px);margin:0 auto}

#game .game-board{width:min(100%,1120px);margin:0 auto;display:grid;grid-template-columns:minmax(230px,.78fr) minmax(0,1.35fr);gap:14px;align-items:stretch;flex:1}

#game .patient-panel{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}

#game .patient-avatar{font-size:clamp(58px,8vw,90px);line-height:1;filter:drop-shadow(0 4px 0 #e8b4cd)}

#game #tools{display:flex;gap:8px;flex-wrap:wrap}

/* Visible title overlay on the open sky area of the title artwork */
#menu>.menu-title{position:absolute;z-index:2;right:4vw;top:12vh;width:min(43vw,700px);padding:clamp(14px,2vw,26px);text-align:center;background:rgba(255,250,244,.82);border:3px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:0 7px 0 rgba(193,115,155,.52),0 12px 30px rgba(75,60,90,.18);backdrop-filter:blur(3px)}
#menu>.menu-title h1{display:block;margin:0;color:#bd4f83;font-family:"Mali",cursive;font-size:clamp(34px,5vw,72px);line-height:1.15;font-weight:700;text-shadow:0 3px 0 #fff,0 6px 0 rgba(202,128,162,.38);letter-spacing:.02em}
#menu>.menu-title p{margin:8px 0 0;color:#624257;font-weight:700;font-size:clamp(13px,1.55vw,22px);line-height:1.45}
@media(max-width:760px){#menu>.menu-title{right:4%;top:10%;width:92%;padding:10px 12px;border-radius:18px}#menu>.menu-title h1{font-size:clamp(27px,8vw,42px)}#menu>.menu-title p{font-size:clamp(11px,3.5vw,15px);margin-top:3px}}

/* Ensure screen sections stay hidden even when their IDs define display styles */
section.hidden{display:none!important}
/* Character creation: pastel pixel hospital scene and clear character cards */
#setup:not(.hidden){position:relative;isolation:isolate;max-width:none;min-height:100svh;padding:clamp(18px,3vh,38px) 16px 30px;background:linear-gradient(90deg,rgba(255,239,247,.48),rgba(245,251,255,.48)),url('assets/character-select-bg.png') center/cover fixed;}
#setup:not(.hidden)>h1,#setup:not(.hidden)>.box{width:min(100%,900px);margin-left:auto;margin-right:auto;}
#setup:not(.hidden)>h1{display:block;margin-top:0;color:#bd4f83;text-shadow:0 2px #fff,0 4px rgba(198,125,159,.36);}
#setup:not(.hidden)>.box{background:rgba(255,253,250,.94);backdrop-filter:blur(4px);}
#pick>button{min-height:180px!important;justify-content:center;background:rgba(255,255,255,.92);border-width:3px;border-radius:22px;box-shadow:0 6px 0 #d982ad,0 10px 20px rgba(90,55,80,.12);font-size:clamp(15px,1.5vw,19px)!important;}
#pick>button[aria-pressed="true"]{background:linear-gradient(180deg,#fff4bd,#ffe18a);border-color:#ed9fbd;}
#pick .avatar-wrap{width:120px;height:120px;background:linear-gradient(145deg,#eaf8ff,#fff0f6);border-width:3px;box-shadow:0 3px 0 rgba(217,130,173,.4);}
#pick .avatar-wrap svg{width:78px!important;height:98px!important;image-rendering:pixelated;shape-rendering:crispEdges;}
@media(max-width:600px){#setup:not(.hidden){padding:14px 10px 24px;background-attachment:scroll}#pick>button{min-height:145px!important;padding:8px!important}#pick .avatar-wrap{width:94px;height:94px}#pick .avatar-wrap svg{width:62px!important;height:78px!important}}
/* Full-screen gameplay layout with an animated doctor and answer reactions */
#game{height:100svh;min-height:100svh;width:100%;padding:clamp(10px,1.6vw,24px);overflow:auto}
#game .game-board{grid-template-columns:minmax(270px,.72fr) minmax(0,1.45fr);gap:clamp(10px,1.2vw,18px);min-height:0}
#game .patient-panel{justify-content:flex-start;gap:clamp(9px,1.2vh,15px)}
#game .patient-scene{min-height:clamp(170px,25vh,280px);flex:0 0 auto;gap:clamp(12px,2vw,30px)}
#game .question-panel{justify-content:flex-start;gap:clamp(10px,1.5vh,18px)}
#game .question-title{margin:0}
#game .question-text{margin:0}
#game #opts{gap:clamp(8px,1vh,12px)}
#game .opt{min-height:clamp(54px,7vh,78px);padding:12px 16px}
#game .character-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:130px}
#game .patient-avatar{display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;animation:doctor-idle 2s ease-in-out infinite}
#game .patient-avatar svg{width:clamp(82px,9vw,132px)!important;height:auto!important;image-rendering:pixelated;filter:drop-shadow(0 5px 0 #e8b4cd)}
#game .doctor-reaction{padding:7px 12px;border:2px solid #e9a6c7;border-radius:14px;background:#fff;color:#77445f;font-size:clamp(12px,1.15vw,16px);font-weight:700;text-align:center;box-shadow:0 3px 0 #d89bb8;transition:background .2s,transform .2s}
#game .doctor-reaction.is-correct{background:#e5f8e9;border-color:#7cc992;color:#317446;transform:scale(1.05)}
#game .doctor-reaction.is-wrong{background:#fff0dc;border-color:#edbd72;color:#8b5b28}
#game .patient-avatar.reaction-correct{animation:doctor-cheer .7s ease-in-out 2}
#game .patient-avatar.reaction-wrong{animation:doctor-worried .5s ease-in-out 2}
#game .monitor{animation:heart-pulse 1.2s ease-in-out infinite;}
@keyframes doctor-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes doctor-cheer{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-24px) rotate(-7deg)}70%{transform:translateY(-10px) rotate(7deg)}}
@keyframes doctor-worried{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-4deg)}75%{transform:translateX(7px) rotate(4deg)}}
@keyframes heart-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(max-width:760px){#game{height:auto;min-height:100svh;overflow:visible}#game .game-board{grid-template-columns:1fr}#game .patient-scene{min-height:130px}#game .patient-panel{display:flex;align-items:stretch}#game .patient-panel>.tag,#game .patient-panel>div[style*="font-weight"]{grid-column:auto}#game .patient-avatar svg{width:72px!important}#game .question-panel{gap:9px}}
@media(prefers-reduced-motion:reduce){#game .patient-avatar,#game .monitor{animation:none!important}#game .doctor-reaction{transition:none}}
/* Portrait screens: center the doctor in the title artwork and widen the menu */
@media(max-width:1024px) and (orientation:portrait){
 #menu>.title-hero{object-position:0% center}
 #menu>.menu-title{left:4%;right:4%;top:9%;width:92%;transform:none}
 #menu>.menu-actions{left:50%;right:auto;transform:translateX(-50%);bottom:clamp(88px,11vh,126px);width:min(92vw,620px);padding:10px;gap:8px}
 #menu>.site-credit{left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap}
}

function answer(i,btn){
 if(S.cur.done)return;S.cur.done=true;clearInterval(T);
 var q=S.queue[S.i],ok=i===q.a;
 var actor=$("doctorCharacter"),reaction=$("doctorReaction");
 if(actor){actor.classList.remove("reaction-correct","reaction-wrong");actor.classList.add(ok?"reaction-correct":"reaction-wrong")}
 if(reaction){reaction.textContent=ok?"เยี่ยมมาก! คนไข้ปลอดภัย 💖":"ไม่เป็นไรนะ ลองเคสถัดไปกัน 💪";reaction.classList.toggle("is-correct",ok);reaction.classList.toggle("is-wrong",!ok)}
 if(ok)Music.correct();else Music.wrong();
 var st=S.stats[q.t]=S.stats[q.t]||{ok:0,bad:0};
 document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(+b.dataset.i===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
 $("hint").disabled=true;
 var pts=40*q.lv,msg;
 if(ok){
  st.ok++;
  if(S.mode==="solo"){S.streak++;var bonus=S.streak>=3?20:0;S.score+=pts+bonus;S.gold+=30+bonus;msg="เยี่ยมมาก! คนไข้ปลอดภัย 🎉 +"+pts+" คะแนน"+(bonus?" (โบนัสต่อเนื่อง +"+bonus+"!)":"")}
  else{var t=S.teams[S.i%S.n];t.score+=pts;t.gold+=30;t.ok++;msg=t.name+" ตอบถูก เก่งจัง! 🎉 +"+pts+" คะแนน"}
 }else{
  st.bad++;
  if(S.mode==="solo"){
   S.streak=0;S.lives--;msg=i<0?"หมดเวลา! ⏰ คนไข้อาการแย่ลง 🥺":"แง๊! คนไข้อาการแย่ลง 🥺";
   if(!S.retried[S.i]&&S.lives>0){S.retried[S.i]=1;S.queue.push(q);msg+=" (เดี๋ยวข้อนี้จะวนมาให้แก้ตัวใหม่นะ ฮึบๆ 💪)"}
  }else msg="ตอบผิดอ่า 🥺 คนไข้ต้องรอการรักษาต่อไปนะ";
 }
 var f=$("fb");
 f.innerHTML='<p style="font-size: 16px; color: '+(ok?'var(--green)':'var(--red)')+';"><b>'+(ok?"✅ ":"❌ ")+msg+'</b></p><div class="ex">💡 <b>รู้หรือไม่:</b> '+esc(q.e)+'</div><button id="nx">'+((S.mode==="solo"&&S.lives<=0)||S.i+1>=S.queue.length?"ดูสรุปผลกันเถอะ 📊":"เคสถัดไป ลุย! 🚀")+'</button>';
 $("nx").onclick=function(){S.i++;if(S.mode==="solo"&&S.lives<=0)S.i=S.queue.length;render()};
 $("nx").focus();
}
function weak(){
 var rows=Object.keys(S.stats).map(function(k){return{k:k,b:S.stats[k].bad,o:S.stats[k].ok}}).sort(function(a,b){return b.b-a.b});
 var h='<h3 style="margin:16px 0 8px; color: var(--accent);">🔍 หัวข้อที่น่าทบทวน</h3>';
 var any=rows.filter(function(r){return r.b>0});
 if(!any.length)return h+'<p class="case" style="text-align:center; background: var(--ok); border-color: var(--green);">ไม่พลาดเลยสักหัวข้อ เก่งสุดๆ ปรบมือ! 👏👏</p>';
 any.forEach(function(r){h+='<p style="margin:6px 0">• '+r.k+' <span class="mut">(พลาด '+r.b+' ถูก '+r.o+')</span></p>'});
 return h;
}
function finish(){
 clearInterval(T);if(S.mode==="solo")G.gold=S.gold;recordShift();var h='<h1>🎉 สรุปผลเวร 🎉</h1><div class="box" style="text-align:center;">';
 if(S.mode==="solo"){
  h+='<div class="avatar-wrap" style="margin-bottom:12px;">'+doc(S.P.g,S.P.c,80,1)+'</div><p style="font-size:18px;"><b>คุณ'+esc(S.name)+'</b><br>'+(S.lives>0?"จบเวรครบทุกเคส เก่งมั่กๆ! 🎊":"หมดแรงซะก่อน พักผ่อนนะ 💤")+'</p><div class="case" style="display:inline-block; text-align:left;"><p style="margin:4px; font-size:16px;">⭐ คะแนนรวม: <b>'+S.score+'</b></p><p style="margin:4px; font-size:16px;">🪙 เหรียญทอง: <b>'+S.gold+'</b></p></div>';
 }else{
  var r=S.teams.slice().sort(function(a,b){return b.score-a.score});
  h+='<p style="font-size:18px; color: var(--accent)"><b>🏆 อันดับทีม 🏆</b></p>';
  r.forEach(function(t,k){
      var medal = k===0 ? "🥇" : k===1 ? "🥈" : k===2 ? "🥉" : "🎀";
      h+='<p class="case" style="text-align:left; margin:8px 0;">'+medal+' <b>'+t.name+'</b><br><span class="mut">ได้ไป '+t.score+' คะแนน (ตอบถูก '+t.ok+' เคส)</span></p>'});
 }
 h+='</div><div class="box" style="text-align:left;">'+weak()+'<button id="again" style="margin-top:16px;">🎮 เล่นอีกรอบให้ชื่นใจ</button><button class="alt" id="rp">📋 ดูรายงานเวร</button><button class="alt" id="mn">กลับเมนู 🏡</button></div>';
 $("result").innerHTML=h;show("result");
 $("again").onclick=function(){S.mode==="solo"?startSolo(S.name,S.tm):startTeam(S.n,S.m,S.queue.length/S.n)};
 $("mn").onclick=function(){show("menu")};$("rp").onclick=report;
}
</script>
</body>
</html>
